<aside class="academic-profile" aria-label="About {{ site.author.name | escape }}">
  <a class="profile-photo-link" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name | escape }} homepage">
    <img class="profile-photo" src="{{ '/images/' | append: site.author.avatar | relative_url }}" alt="{{ site.author.name | escape }}" width="128" height="172">
  </a>
  {% if page.url == '/' %}<h1 class="profile-name">{{ site.author.name | escape }}</h1>{% else %}<p class="profile-name">{{ site.author.name | escape }}</p>{% endif %}
  <p class="profile-role">{{ site.author.bio | escape }}</p>
  <p class="profile-affiliation">{{ site.author.employer | escape }}</p>
  <a class="profile-email" href="mailto:{{ site.author.email }}">{{ site.author.email | replace: '@', ' (at) ' | escape }}</a>
  <div class="profile-social" aria-label="Contact and academic profiles">
    <a href="{{ site.author.googlescholar | escape }}" aria-label="Google Scholar" title="Google Scholar"><i class="ai ai-google-scholar" aria-hidden="true"></i></a>
  </div>
  <nav class="profile-nav" aria-label="Page navigation">
    <a href="{{ '/' | relative_url }}#about-me">About</a>
    <span aria-hidden="true">·</span>
    <a href="{{ '/' | relative_url }}#news">News</a>
    <span aria-hidden="true">·</span>
    <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
  </nav>
</aside>
